name: Build and Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: iodrive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Type Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check and dry-run build
        run: npm run check

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Validate required configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          META_DB_ID: ${{ secrets.META_DB_ID }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_DOMAIN: ${{ vars.R2_PUBLIC_DOMAIN }}
        run: |
          missing=0
          check() { if [ -z "${!1}" ]; then echo "::error::Missing $2: $1"; missing=1; fi; }
          check CLOUDFLARE_API_TOKEN  "secret"
          check CLOUDFLARE_ACCOUNT_ID "secret"
          check META_DB_ID            "secret"
          check ADMIN_PASS            "secret"
          check JWT_SECRET            "secret"
          check TURNSTILE_SITE_KEY    "secret"
          check TURNSTILE_SECRET      "secret"
          check DEPLOY_DOMAIN         "variable"
          check R2_BUCKET             "variable"
          check R2_PUBLIC_DOMAIN      "variable"
          [ "$missing" -eq 0 ] || { echo "::error::Configure the missing repository secrets/variables, see docs/FORK_DEPLOY.md"; exit 1; }
          echo "All required configuration is present."

      - name: Create wrangler.toml
        env:
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          SITE_ID: ${{ vars.SITE_ID }}
          ADMIN_USER: ${{ vars.ADMIN_USER }}
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_DOMAIN: ${{ vars.R2_PUBLIC_DOMAIN }}
          CACHE_KV_ID: ${{ secrets.CACHE_KV_ID }}
          RATE_LIMITER_NAMESPACE_ID: ${{ vars.RATE_LIMITER_NAMESPACE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
        run: |
          WORKER_NAME="${WORKER_NAME:-iodrive}"
          SITE_ID="${SITE_ID:-production}"
          ADMIN_USER="${ADMIN_USER:-admin}"

          cat > wrangler.toml <<EOF
          name = "${WORKER_NAME}"
          main = "src/index.ts"
          compatibility_date = "2026-09-12"
          compatibility_flags = ["nodejs_compat"]
          workers_dev = false
          preview_urls = false
          account_id = "${CLOUDFLARE_ACCOUNT_ID}"
          routes = [{ pattern = "${DEPLOY_DOMAIN}", custom_domain = true }]

          [vars]
          SITE_ID = "${SITE_ID}"
          ADMIN_USER = "${ADMIN_USER}"
          APP_DOMAIN = "${DEPLOY_DOMAIN}"
          R2_PUBLIC_DOMAIN = "${R2_PUBLIC_DOMAIN}"
          TURNSTILE_SITE_KEY = "${TURNSTILE_SITE_KEY}"
          PUBLIC_UPLOAD_PATH = "uploads/public/"
          PUBLIC_UPLOAD_MAX_BYTES = "2147483648"

          [[r2_buckets]]
          binding = "DRIVE"
          bucket_name = "${R2_BUCKET}"

          [observability]
          enabled = true
          [observability.logs]
          invocation_logs = true
          head_sampling_rate = 1
          [observability.traces]
          enabled = true
          head_sampling_rate = 0.01
          EOF

          if [ -n "${CACHE_KV_ID}" ]; then
            cat >> wrangler.toml <<EOF

          [[kv_namespaces]]
          binding = "CACHE_KV"
          id = "${CACHE_KV_ID}"
          EOF
          fi

          cat >> wrangler.toml <<EOF

          [[d1_databases]]
          binding = "META_DB"
          database_name = "iodrive-meta"
          database_id = "${{ secrets.META_DB_ID }}"
          migrations_dir = "database/migrations"
          EOF

          if [ -n "${RATE_LIMITER_NAMESPACE_ID}" ]; then
            cat >> wrangler.toml <<EOF

          [[ratelimits]]
          name = "RATE_LIMITER"
          namespace_id = "${RATE_LIMITER_NAMESPACE_ID}"
          [ratelimits.simple]
          limit = 100
          period = 60
          EOF
          fi

          echo "Generated wrangler.toml:"
          cat wrangler.toml

      - name: Ensure R2 bucket exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          if output=$(npx wrangler r2 bucket create "$R2_BUCKET" 2>&1); then
            echo "$output"
          elif echo "$output" | grep -qi "already exists"; then
            echo "R2 bucket \"$R2_BUCKET\" already exists, continuing."
          else
            echo "$output"
            exit 1
          fi

      - name: Apply database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply META_DB --remote

      - name: Upload application secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          printf '%s' "$ADMIN_PASS" | npx wrangler secret put ADMIN_PASS
          printf '%s' "$JWT_SECRET" | npx wrangler secret put JWT_SECRET
          printf '%s' "$TURNSTILE_SECRET" | npx wrangler secret put TURNSTILE_SECRET

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Success
        env:
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
        run: |
          echo "Deployed: https://$DEPLOY_DOMAIN"
